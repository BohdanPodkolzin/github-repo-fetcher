services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Values come from .env in this folder (Compose reads it automatically).
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume: data survives container removal.
      - pgdata:/var/lib/postgresql/data
      # Schema, applied only when the volume is empty.
      - ./fetcher-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No "ports:" on purpose: the database is reachable only inside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./fetcher-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
